<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>เช็คอาการวันนี้ - Sepsis Care</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        :root {
            --medical-blue: #0288D1;
            --medical-magenta: #E91E63;
            --medical-dark: #0F172A;
            --bg-light: #F8FAFC;
            --card-white: #FFFFFF;
        }

        html, body {
            overflow-x: hidden;
            width: 100%;
            max-width: 100vw;
            margin: 0;
            padding: 0;
            background-color: var(--bg-light);
            font-family: 'Sarabun', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
        }

        .container {
            max-width: 460px;
            padding: 24px 18px;
            width: 100%;
        }

        .app-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .app-header .logo-icon {
            background: linear-gradient(135deg, #0288D1 0%, #7B3F9E 55%, #E91E63 100%);
            width: 68px;
            height: 68px;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            color: #fff;
            box-shadow: 0 8px 24px rgba(2, 136, 209, 0.25);
            margin-bottom: 12px;
        }

        .app-header h1 {
            font-weight: 700;
            font-size: 24px;
            color: var(--medical-dark);
            margin: 0;
        }

        .app-header h1 span {
            color: var(--medical-magenta);
        }

        .app-header p {
            color: #64748B;
            font-size: 14px;
            margin-top: 4px;
        }

        .option-card {
            display: flex;
            align-items: center;
            gap: 16px;
            background: var(--card-white);
            border-radius: 20px;
            border: 1.5px solid #E2E8F0;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
            padding: 20px 18px;
            margin-bottom: 16px;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .option-card:active {
            transform: scale(0.98);
        }

        .option-card .option-icon {
            width: 54px;
            height: 54px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            color: #fff;
            flex-shrink: 0;
        }

        .option-card.daily .option-icon {
            background: linear-gradient(135deg, #0288D1, #00B0FF);
        }

        .option-card.screening .option-icon {
            background: linear-gradient(135deg, #E91E63, #8E24AA);
        }

        .option-card .option-text .fw-bold {
            font-size: 17px;
            color: var(--medical-dark);
            display: block;
            margin-bottom: 2px;
        }

        .option-card .option-text .sub-text {
            font-size: 13px;
            color: #64748B;
            line-height: 1.35;
            display: block;
        }

        .option-card .bi-chevron-right {
            margin-left: auto;
            color: #94A3B8;
            font-size: 20px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="app-header">
            <div class="logo-icon">
                <i class="bi bi-clipboard2-pulse-fill"></i>
            </div>
            <h1>เช็คอาการ<span>วันนี้</span></h1>
            <p>เลือกแบบประเมินสุขภาพที่ต้องการทำ</p>
        </div>

        <a href="/liff/daily-check/?mode=direct" class="option-card daily">
            <div class="option-icon"><i class="bi bi-calendar2-check-fill"></i></div>
            <div class="option-text">
                <span class="fw-bold">เช็คอาการรายวัน</span>
            </div>
            <i class="bi bi-chevron-right"></i>
        </a>

        <a href="/liff/screening/" class="option-card screening">
            <div class="option-icon"><i class="bi bi-shield-exclamation"></i></div>
            <div class="option-text">
                <span class="fw-bold">คัดกรองภาวะเซพซิสในชุมชน</span>
            </div>
            <i class="bi bi-chevron-right"></i>
        </a>
    </div>

    <script>
        window.onload = function () {
            if (typeof liff !== 'undefined') {
                liff.init({ liffId: "2011343821-EueojT3K" }).catch(() => { });
            }
        };
    </script>
</body>

</html>
