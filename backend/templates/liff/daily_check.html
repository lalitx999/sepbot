<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เช็คอาการประจำวัน - Sepsis Care</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@200..900&family=Sarabun:wght@300;400;600;700&display=swap"
        rel="stylesheet">
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        html, body {
            overflow-x: hidden;
            width: 100%;
            max-width: 100vw;
            margin: 0;
            padding: 0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Sarabun', 'Noto Serif Thai', sans-serif;
            background: linear-gradient(145deg, #eef1fb 0%, #f6e8f2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        /* Decorative background circles */
        body::before,
        body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            z-index: 0;
            opacity: 0.2;
        }

        body::before {
            width: 350px;
            height: 350px;
            background: #64B5F6;
            top: -100px;
            right: -80px;
        }

        body::after {
            width: 450px;
            height: 450px;
            background: #F06292;
            bottom: -150px;
            left: -120px;
        }

        .container {
            max-width: 520px;
            position: relative;
            z-index: 1;
        }

        /* Header */
        .app-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .app-header .logo-icon {
            background: linear-gradient(135deg, #1565C0 0%, #7B3F9E 55%, #D6006C 100%);
            width: 64px;
            height: 64px;
            border-radius: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: #fff;
            box-shadow: 0 8px 24px rgba(123, 63, 158, 0.3);
            margin-bottom: 12px;
            transition: transform 0.3s ease;
        }

        .app-header .logo-icon:hover {
            transform: scale(1.05) rotate(-3deg);
        }

        .app-header h1 {
            font-weight: 700;
            font-size: 26px;
            color: #0a2a3a;
            letter-spacing: -0.5px;
            margin: 0;
        }

        .app-header h1 span {
            color: #7B3F9E;
        }

        .app-header p {
            color: #3a5f73;
            font-size: 15px;
            font-weight: 400;
            margin-top: 4px;
        }

        /* Card */
        .card-check {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 28px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 20px 60px rgba(123, 63, 158, 0.10), 0 8px 20px rgba(0, 0, 0, 0.03);
            padding: 32px 28px;
            transition: box-shadow 0.3s ease;
        }

        .card-check:hover {
            box-shadow: 0 30px 80px rgba(123, 63, 158, 0.15);
        }

        /* Form Labels */
        .form-label {
            font-weight: 600;
            font-size: 15px;
            color: #0a2a3a;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-label .bi {
            font-size: 18px;
            color: #7B3F9E;
            opacity: 0.7;
        }

        /* Select Dropdown */
        .form-select {
            border-radius: 14px;
            padding: 12px 16px;
            border: 2px solid #e4edf2;
            background: #f9fbfc url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3e%3cpath fill='none' stroke='%237B3F9E' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='m2 5 6 6 6-6'/%3e%3c/svg%3e") no-repeat right 1rem center/16px 12px;
            font-size: 15px;
            font-weight: 400;
            transition: all 0.25s ease;
            color: #0a2a3a;
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
        }

        .form-select:focus {
            border-color: #7B3F9E;
            background-color: #ffffff;
            box-shadow: 0 0 0 5px rgba(123, 63, 158, 0.10);
            outline: none;
        }

        .form-select option {
            padding: 8px;
        }

        /* Divider */
        hr {
            border: none;
            height: 2px;
            background: linear-gradient(to right, transparent, #d0e2ed, transparent);
            opacity: 0.6;
            margin: 20px 0;
        }

        /* Symptom Question Item */
        .q-item {
            padding: 14px 16px;
            background: #f9fbfc;
            border-radius: 14px;
            border: 2px solid #e4edf2;
            margin-bottom: 12px;
        }

        .q-label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 15px;
            color: #0a2a3a;
            margin-bottom: 12px;
        }

        .q-label .q-number {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #e4edf2;
            color: #0a2a3a;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-size: 13px;
            font-weight: 700;
            flex-shrink: 0;
        }

        .q-label .bi {
            font-size: 18px;
            color: #5a7a8a;
        }

        /* มี / ไม่มี Answer Toggle */
        .answer-group {
            display: flex;
            gap: 10px;
        }

        .answer-btn {
            flex: 1;
            padding: 10px;
            border-radius: 12px;
            border: 2px solid #e4edf2;
            background: #ffffff;
            font-weight: 700;
            font-size: 14px;
            color: #6a8a9a;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .answer-btn:hover {
            border-color: #c0d0d8;
        }

        .answer-btn.active[data-value="false"] {
            border-color: #28a745;
            background: #eafaf0;
            color: #157347;
        }

        .answer-btn.active[data-value="true"] {
            border-color: #7B3F9E;
            background: #f4eefa;
            color: #7B3F9E;
        }

        /* Submit Button */
        .btn-submit {
            background: linear-gradient(135deg, #1565C0, #7B3F9E 55%, #D6006C);
            color: #ffffff;
            border-radius: 16px;
            font-weight: 700;
            font-size: 17px;
            padding: 14px;
            border: none;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(123, 63, 158, 0.25);
            letter-spacing: 0.3px;
        }

        .btn-submit:hover {
            background: linear-gradient(135deg, #0D47A1, #5B2E82 55%, #AD0059);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(123, 63, 158, 0.35);
            color: #fff;
        }

        .btn-submit:active {
            transform: translateY(0);
            box-shadow: 0 4px 12px rgba(123, 63, 158, 0.2);
        }

        .btn-submit:disabled {
            opacity: 0.7;
            transform: none;
            box-shadow: none;
        }

        /* Result Card */
        #resultCard {
            margin-top: 20px;
            padding: 24px 28px;
            border-radius: 28px;
            animation: fadeSlideUp 0.5s ease;
        }

        #resultCard h5 {
            font-weight: 700;
            font-size: 17px;
            color: #0a2a3a;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #resultCard h5 .bi {
            font-size: 22px;
            color: #7B3F9E;
        }

        .status-badge {
            font-size: 1.15rem;
            padding: 14px 20px;
            border-radius: 14px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
        }

        .status-badge.bg-success {
            background: linear-gradient(135deg, #d4edda, #b7dfc9) !important;
            color: #0a3a1a !important;
            border: 2px solid #8fcf9f;
        }

        .status-badge.bg-warning {
            background: linear-gradient(135deg, #fff3cd, #ffe69c) !important;
            color: #5a3a0a !important;
            border: 2px solid #f5c842;
        }

        .status-badge.bg-danger {
            background: linear-gradient(135deg, #f8d7da, #f5c2c7) !important;
            color: #5a0a0a !important;
            border: 2px solid #e07a7a;
        }

        .status-badge .bi {
            font-size: 28px;
        }

        #resultAdvice {
            font-size: 15px;
            color: #2a4a5a;
            text-align: center;
            margin-top: 12px;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 12px;
            font-weight: 400;
        }

        @keyframes fadeSlideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive */
        @media (max-width: 480px) {
            .card-check {
                padding: 24px 18px;
                border-radius: 22px;
            }

            .app-header h1 {
                font-size: 22px;
            }

            .app-header .logo-icon {
                width: 56px;
                height: 56px;
                font-size: 26px;
            }

            .form-check {
                padding: 12px 14px;
            }

            .form-check .form-check-label {
                font-size: 14px;
            }

            .form-check .form-check-input {
                width: 44px;
                height: 24px;
            }

            .status-badge {
                font-size: 1rem;
                padding: 12px 16px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Header -->
        <div class="app-header">
            <div class="logo-icon">
                <i class="bi bi-heart-pulse-fill"></i>
            </div>
            <h1>Sepsis <span>Care</span></h1>
            <p>เช็คอาการประจำวัน เพื่อความปลอดภัยของคุณ</p>
        </div>

        <!-- Main Form Card -->
        <div class="card-check">
            <form id="dailyCheckForm">
                <input type="hidden" id="lineUserId" value="U_MOCK_PATIENT_101">

                <!-- Questions -->
                <div class="q-item">
                    <div class="q-label">
                        <span class="q-number">1</span>
                        <i class="bi bi-thermometer-half"></i>
                        วันนี้มีไข้หรือหนาวสั่นไหม?
                    </div>
                    <div class="answer-group" id="hasFever">
                        <button type="button" class="answer-btn active" data-value="false">ไม่มี</button>
                        <button type="button" class="answer-btn" data-value="true">มี</button>
                    </div>
                </div>

                <div class="q-item">
                    <div class="q-label">
                        <span class="q-number">2</span>
                        <i class="bi bi-bandage"></i>
                        วันนี้แผลแดง บวม หรือมีน้ำออกไหม? (ถ้ามี)
                    </div>
                    <div class="answer-group" id="hasWound">
                        <button type="button" class="answer-btn active" data-value="false">ไม่มี</button>
                        <button type="button" class="answer-btn" data-value="true">มี</button>
                    </div>
                </div>

                <div class="q-item">
                    <div class="q-label">
                        <span class="q-number">3</span>
                        <i class="bi bi-lungs"></i>
                        วันนี้หายใจเหนื่อยกว่าปกติไหม?
                    </div>
                    <div class="answer-group" id="hasBreathless">
                        <button type="button" class="answer-btn active" data-value="false">ไม่เหนื่อย</button>
                        <button type="button" class="answer-btn" data-value="true">เหนื่อย</button>
                    </div>
                </div>

                <div class="q-item">
                    <div class="q-label">
                        <span class="q-number">4</span>
                        <i class="bi bi-person-exclamation"></i>
                        วันนี้ซึมหรือสับสนกว่าปกติไหม?
                    </div>
                    <div class="answer-group" id="hasConfused">
                        <button type="button" class="answer-btn active" data-value="false">ไม่มี</button>
                        <button type="button" class="answer-btn" data-value="true">มี</button>
                    </div>
                </div>

                <div class="q-item">
                    <div class="q-label">
                        <span class="q-number">5</span>
                        <i class="bi bi-cup-straw"></i>
                        วันนี้กินอาหารหรือดื่มน้ำได้น้อยลงไหม?
                    </div>
                    <div class="answer-group" id="hasLessEat">
                        <button type="button" class="answer-btn active" data-value="false">ไม่ลดลง</button>
                        <button type="button" class="answer-btn" data-value="true">ลดลง</button>
                    </div>
                </div>

                <hr>

                <!-- Responder -->
                <div class="mb-3">
                    <label class="form-label"><i class="bi bi-person-bounding-box"></i> วันนี้ใครเป็นผู้ตอบแบบประเมิน</label>
                    <select id="responder" class="form-select">
                        <option value="patient">ผู้ป่วยตอบเอง</option>
                        <option value="caregiver_help">ผู้ดูแลช่วยตอบ</option>
                        <option value="caregiver_replace">ผู้ดูแลตอบแทนผู้ป่วย</option>
                    </select>
                </div>

                <button type="submit" class="btn-submit w-100 mt-3">
                    <i class="bi bi-send me-2"></i> ส่งผลประเมินอาการ
                </button>
            </form>
        </div>

        <!-- Result Display Card -->
        <div id="resultCard" class="card-check d-none">
            <h5><i class="bi bi-clipboard2-check"></i> ผลการประเมินอาการ</h5>
            <div id="resultBadge" class="status-badge mb-2"></div>
            <p id="resultAdvice"></p>
        </div>
    </div>

    <script>
        // Initialize LIFF or Fallback Mock ID for Local Browser Testing
        window.onload = function () {
            const storedUid = localStorage.getItem('sepbot_line_user_id');
            if (storedUid) {
                document.getElementById('lineUserId').value = storedUid;
            }

            if (typeof liff !== 'undefined') {
                liff.init({ liffId: "2011343821-EueojT3K" }).then(() => {
                    if (liff.isLoggedIn()) {
                        liff.getProfile().then(profile => {
                            document.getElementById('lineUserId').value = profile.userId;
                            localStorage.setItem('sepbot_line_user_id', profile.userId);
                        });
                    }
                }).catch(err => {
                    console.log("LIFF Init Fallback:", err);
                });
            }
        };

        // มี / ไม่มี answer toggle buttons
        document.querySelectorAll('.answer-group').forEach(function (group) {
            group.querySelectorAll('.answer-btn').forEach(function (btn) {
                btn.addEventListener('click', function () {
                    group.querySelectorAll('.answer-btn').forEach(function (b) { b.classList.remove('active'); });
                    btn.classList.add('active');
                });
            });
        });

        function getAnswer(groupId) {
            const active = document.querySelector('#' + groupId + ' .answer-btn.active');
            return active ? active.dataset.value === 'true' : false;
        }

        document.getElementById('dailyCheckForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const submitBtn = e.target.querySelector('button[type="submit"]');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="bi bi-hourglass-split me-2"></i> กำลังประมวลผล...';

            const payload = {
                line_user_id: document.getElementById('lineUserId').value,
                responder: document.getElementById('responder').value,
                has_fever: getAnswer('hasFever'),
                has_wound: getAnswer('hasWound'),
                has_breathless: getAnswer('hasBreathless'),
                has_confused: getAnswer('hasConfused'),
                has_less_eat: getAnswer('hasLessEat'),
            };

            try {
                const response = await fetch('/api/v1/assessment/daily-check/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (response.ok) {
                    const res = data.daily_check;
                    const card = document.getElementById('resultCard');
                    const badge = document.getElementById('resultBadge');
                    const advice = document.getElementById('resultAdvice');

                    card.classList.remove('d-none');

                    if (res.result_level === 'green') {
                        badge.className = 'status-badge bg-success';
                        badge.innerHTML = '<i class="bi bi-check-circle-fill"></i> ปกติ (สีเขียว)';
                        advice.innerText = 'อาการปกติ ให้ดูแลตนเองตามแผนการดูแลอย่างต่อเนื่อง';
                    } else if (res.result_level === 'yellow') {
                        badge.className = 'status-badge bg-warning';
                        badge.innerHTML = '<i class="bi bi-exclamation-triangle-fill"></i> อาการเฝ้าระวัง (สีเหลือง)';
                        advice.innerText = 'พบอาการเสี่ยง ควรพักผ่อน สังเกตอาการใกล้ชิด และติดต่อพยาบาล';
                    } else {
                        badge.className = 'status-badge bg-danger';
                        badge.innerHTML = '<i class="bi bi-exclamation-octagon-fill"></i> อาการวิกฤต (สีแดง)';
                        advice.innerText = 'กรุณานำผู้ป่วยส่งโรงพยาบาลด่วน หรือโทร 1669 ทันที!';
                    }

                    // Scroll to result
                    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                } else {
                    const errorMsg = data.error || data.message || JSON.stringify(data);
                    if (errorMsg.includes("ไม่พบผู้ใช้ในระบบ")) {
                        Swal.fire({
                            title: 'คุณยังไม่ได้ลงทะเบียน',
                            text: 'โปรดลงทะเบียนเพื่อสร้างกลุ่มครอบครัวก่อนเริ่มใช้งานนะคะ',
                            icon: 'warning',
                            confirmButtonText: '📝 ไปหน้าลงทะเบียน',
                            confirmButtonColor: '#E91E63',
                            showCancelButton: true,
                            cancelButtonText: 'ยกเลิก'
                        }).then((res) => {
                            if (res.isConfirmed) {
                                window.location.href = "https://liff.line.me/2011343821-vFX0ZUTO";
                            }
                        });
                    } else {
                        Swal.fire('เกิดข้อผิดพลาด', errorMsg, 'error');
                    }
                }
            } catch (err) {
                Swal.fire('ข้อผิดพลาดเครือข่าย', 'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้ กรุณาลองใหม่อีกครั้ง', 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="bi bi-send me-2"></i> ส่งผลประเมินอาการ';
            }
        });
    </script>
</body>

</html>
