<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>บันทึกสัญญาณชีพ - SepCare</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@200..900&family=Sarabun:wght@300;400;600;700&display=swap"
        rel="stylesheet">
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        html, body {
            overflow-x: hidden;
            width: 100%;
            max-width: 100vw;
            margin: 0;
            padding: 0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Sarabun', 'Noto Serif Thai', sans-serif;
            background: linear-gradient(145deg, #eef1fb 0%, #f6e8f2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        /* Decorative background circles */
        body::before,
        body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            z-index: 0;
            opacity: 0.2;
        }

        body::before {
            width: 350px;
            height: 350px;
            background: #64B5F6;
            top: -100px;
            right: -80px;
        }

        body::after {
            width: 450px;
            height: 450px;
            background: #F06292;
            bottom: -150px;
            left: -120px;
        }

        .container {
            max-width: 520px;
            position: relative;
            z-index: 1;
        }

        /* Header */
        .app-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .app-header .logo-icon {
            background: linear-gradient(135deg, #1565C0 0%, #7B3F9E 55%, #D6006C 100%);
            width: 64px;
            height: 64px;
            border-radius: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: #fff;
            box-shadow: 0 8px 24px rgba(123, 63, 158, 0.3);
            margin-bottom: 12px;
            transition: transform 0.3s ease;
        }

        .app-header .logo-icon:hover {
            transform: scale(1.05) rotate(-3deg);
        }

        .app-header h1 {
            font-weight: 700;
            font-size: 26px;
            color: #0a2a3a;
            letter-spacing: -0.5px;
            margin: 0;
        }

        .app-header h1 span {
            color: #7B3F9E;
        }

        .app-header p {
            color: #3a5f73;
            font-size: 15px;
            font-weight: 400;
            margin-top: 4px;
        }

        /* Card */
        .card-vital {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 28px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 20px 60px rgba(123, 63, 158, 0.10), 0 8px 20px rgba(0, 0, 0, 0.03);
            padding: 32px 28px;
            transition: box-shadow 0.3s ease;
        }

        .card-vital:hover {
            box-shadow: 0 30px 80px rgba(123, 63, 158, 0.15);
        }

        /* Form Labels */
        .form-label {
            font-weight: 600;
            font-size: 14px;
            color: #0a2a3a;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-label .bi {
            font-size: 17px;
            color: #7B3F9E;
            opacity: 0.8;
        }

        /* Input with icon wrapper */
        .input-group-custom {
            position: relative;
        }

        .input-group-custom .form-control {
            border-radius: 14px;
            padding: 12px 16px;
            padding-left: 44px;
            border: 2px solid #e4edf2;
            background: #f9fbfc;
            font-size: 15px;
            font-weight: 400;
            transition: all 0.25s ease;
            color: #0a2a3a;
        }

        .input-group-custom .form-control:focus {
            border-color: #7B3F9E;
            background: #ffffff;
            box-shadow: 0 0 0 5px rgba(123, 63, 158, 0.10);
            outline: none;
        }

        .input-group-custom .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #6a8a9a;
            font-size: 18px;
            z-index: 2;
            transition: all 0.25s ease;
            pointer-events: none;
        }

        .input-group-custom .form-control:focus+.input-icon,
        .input-group-custom .form-control:focus~.input-icon {
            color: #7B3F9E;
        }

        /* Specific styling for number inputs */
        .form-control[type="number"] {
            -moz-appearance: textfield;
        }

        .form-control[type="number"]::-webkit-outer-spin-button,
        .form-control[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        /* Divider */
        .divider {
            border: none;
            height: 2px;
            background: linear-gradient(to right, transparent, #d0e2ed, transparent);
            opacity: 0.6;
            margin: 20px 0;
        }

        /* Section header for BP */
        .section-subtitle {
            font-weight: 600;
            font-size: 13px;
            color: #4a6a7a;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-subtitle .bi {
            font-size: 16px;
            color: #7B3F9E;
        }

        .section-subtitle::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e4edf2;
        }

        /* Submit Button */
        .btn-submit {
            background: linear-gradient(135deg, #1565C0, #7B3F9E 55%, #D6006C);
            color: #ffffff;
            border-radius: 16px;
            font-weight: 700;
            font-size: 17px;
            padding: 16px;
            border: none;
            transition: all 0.3s ease;
            box-shadow: 0 6px 24px rgba(123, 63, 158, 0.3);
            letter-spacing: 0.3px;
            width: 100%;
        }

        .btn-submit:hover {
            background: linear-gradient(135deg, #0D47A1, #5B2E82 55%, #AD0059);
            transform: translateY(-2px);
            box-shadow: 0 10px 36px rgba(123, 63, 158, 0.4);
            color: #fff;
        }

        .btn-submit:active {
            transform: translateY(0);
            box-shadow: 0 4px 16px rgba(123, 63, 158, 0.25);
        }

        .btn-submit:disabled {
            opacity: 0.7;
            transform: none;
            box-shadow: none;
        }

        /* Success Message */
        #vitalsMsg {
            margin-top: 20px;
            padding: 16px 20px;
            border-radius: 16px;
            border: none;
            animation: fadeSlideUp 0.5s ease;
            background: linear-gradient(135deg, #d4edda, #b7dfc9);
            color: #0a3a1a;
            border-left: 5px solid #28a745;
            font-weight: 600;
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        #vitalsMsg .bi {
            font-size: 22px;
            color: #28a745;
        }

        /* Error Message */
        #vitalsError {
            margin-top: 12px;
            padding: 12px 16px;
            border-radius: 14px;
            animation: fadeSlideUp 0.4s ease;
            background: linear-gradient(135deg, #f8d7da, #f5c2c7);
            color: #5a0a0a;
            border-left: 5px solid #dc3545;
            font-weight: 500;
            font-size: 14px;
            display: none;
            align-items: center;
            gap: 10px;
        }

        #vitalsError .bi {
            font-size: 20px;
            color: #dc3545;
        }

        #vitalsError.show {
            display: flex;
        }

        @keyframes fadeSlideUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive */
        @media (max-width: 480px) {
            .card-vital {
                padding: 24px 18px;
                border-radius: 22px;
            }

            .app-header h1 {
                font-size: 22px;
            }

            .app-header .logo-icon {
                width: 56px;
                height: 56px;
                font-size: 26px;
            }

            .input-group-custom .form-control {
                padding: 10px 14px;
                padding-left: 40px;
                font-size: 14px;
            }

            .input-group-custom .input-icon {
                font-size: 16px;
                left: 12px;
            }

            .form-label {
                font-size: 13px;
            }

            .btn-submit {
                font-size: 15px;
                padding: 14px;
            }
        }

        /* Small screen BP columns */
        @media (max-width: 380px) {
            .row.g-2 .col-6 {
                flex: 0 0 100%;
                max-width: 100%;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Header -->
        <div class="app-header">
            <div class="logo-icon">
                <i class="bi bi-heart-pulse-fill"></i>
            </div>
            <h1>Sep<span>Care</span></h1>
            <p>บันทึกสัญญาณชีพเพื่อติดตามสุขภาพ</p>
        </div>

        <!-- Main Form Card -->
        <div class="card-vital">
            <form id="vitalsForm">
                <input type="hidden" id="lineUserId" value="">

                <!-- Temperature -->
                <div class="mb-3">
                    <label class="form-label" for="temperature">
                        <i class="bi bi-thermometer-half"></i> อุณหภูมิกาย
                        <span class="text-muted fw-normal" style="font-size:13px;">(°C)</span>
                    </label>
                    <div class="input-group-custom">
                        <input type="number" step="0.1" id="temperature" required class="form-control" placeholder="36.8"
                            min="32" max="42">
                        <i class="bi bi-thermometer-half input-icon"></i>
                    </div>
                </div>

                <!-- Blood Pressure - 2 columns -->
                <div class="mb-3">
                    <div class="section-subtitle">
                        <i class="bi bi-heart-pulse"></i> ความดันโลหิต
                    </div>
                    <div class="row g-2">
                        <div class="col-6">
                            <label class="form-label" for="systolic_bp" style="font-size:13px;">
                                <i class="bi bi-arrow-up-short"></i> ความดันบน (SBP)
                            </label>
                            <div class="input-group-custom">
                                <input type="number" id="systolic_bp" required class="form-control" placeholder="120" min="60"
                                    max="250">
                                <i class="bi bi-arrow-up-short input-icon"></i>
                            </div>
                        </div>
                        <div class="col-6">
                            <label class="form-label" for="diastolic_bp" style="font-size:13px;">
                                <i class="bi bi-arrow-down-short"></i> ความดันล่าง (DBP)
                            </label>
                            <div class="input-group-custom">
                                <input type="number" id="diastolic_bp" required class="form-control" placeholder="80" min="30"
                                    max="150">
                                <i class="bi bi-arrow-down-short input-icon"></i>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Heart Rate -->
                <div class="mb-3">
                    <label class="form-label" for="heart_rate">
                        <i class="bi bi-heart-pulse"></i> อัตราการเต้นของหัวใจ
                        <span class="text-muted fw-normal" style="font-size:13px;">(ครั้ง/นาที)</span>
                    </label>
                    <div class="input-group-custom">
                        <input type="number" id="heart_rate" required class="form-control" placeholder="75" min="30" max="200">
                        <i class="bi bi-heart-pulse input-icon"></i>
                    </div>
                </div>

                <!-- Respiratory Rate -->
                <div class="mb-3">
                    <label class="form-label" for="respiratory_rate">
                        <i class="bi bi-wind"></i> อัตราการหายใจ
                        <span class="text-muted fw-normal" style="font-size:13px;">(ครั้ง/นาที)</span>
                    </label>
                    <div class="input-group-custom">
                        <input type="number" id="respiratory_rate" required class="form-control" placeholder="18" min="5"
                            max="60">
                        <i class="bi bi-wind input-icon"></i>
                    </div>
                </div>

                <!-- Consciousness (ความรู้สึกตัว) -->
                <div class="mb-3">
                    <label class="form-label" for="consciousness">
                        <i class="bi bi-person-check"></i> ระดับความรู้สึกตัว
                    </label>
                    <div class="input-group-custom">
                        <select id="consciousness" required class="form-select" style="border-radius:14px; padding:12px 16px; padding-left:44px; border:2px solid #e4edf2; background-color:#f9fbfc; font-size:15px; color:#0a2a3a;">
                            <option value="">-- เลือกความรู้สึกตัว --</option>
                            <option value="alert">ตื่นดี (พูดคุยรู้เรื่อง)</option>
                            <option value="confused">สับสน (กระสับกระส่ายที่เพิ่งเกิดขึ้น)</option>
                            <option value="drowsy">ซึม (แต่เรียกแล้วตาสลึมลือ)</option>
                            <option value="stupor">ซึมมาก (ต้องกระตุ้นจึงจะลืมตา)</option>
                            <option value="unconscious">ไม่รู้สึกตัว (แม้จะกระตุ้นแล้วก็ตาม)</option>
                        </select>
                        <i class="bi bi-person-check input-icon"></i>
                    </div>
                </div>

                <!-- Daily Urine Output (ปริมาณปัสสาวะต่อวัน) -->
                <div class="mb-4">
                    <label class="form-label" for="urine_output">
                        <i class="bi bi-droplet-half"></i> ปริมาณปัสสาวะต่อวัน
                    </label>
                    <div class="input-group-custom">
                        <select id="urine_output" required class="form-select" style="border-radius:14px; padding:12px 16px; padding-left:44px; border:2px solid #e4edf2; background-color:#f9fbfc; font-size:15px; color:#0a2a3a;">
                            <option value="">-- เลือกปริมาณปัสสาวะ --</option>
                            <option value="le_500">น้อยกว่าหรือเท่ากับ 500 มิลลิลิตร</option>
                            <option value="501_999">501 - 999 มิลลิลิตร</option>
                            <option value="ge_1000">มากกว่าหรือเท่ากับ 1,000 มิลลิลิตร</option>
                        </select>
                        <i class="bi bi-droplet-half input-icon"></i>
                    </div>
                </div>

                <button type="submit" class="btn-submit">
                    <i class="bi bi-save me-2"></i> บันทึกสัญญาณชีพ
                </button>
            </form>

            <!-- Success Message -->
            <div id="vitalsMsg" class="d-none">
                <i class="bi bi-check-circle-fill"></i>
                <span id="vitalsMsgText"></span>
                <button type="button" class="btn btn-outline-success btn-sm w-100 mt-2" onclick="closeLiffWindow()">
                    <i class="bi bi-x-circle me-1"></i> ปิดหน้านี้กลับไปที่ LINE
                </button>
            </div>

            <!-- Error Message -->
            <div id="vitalsError">
                <i class="bi bi-exclamation-circle-fill"></i>
                <span id="vitalsErrorText"></span>
            </div>
        </div>
    </div>

    <script>
        // Initialize LIFF or Fallback Mock ID for Local Browser Testing
        window.onload = function () {
            const storedUid = localStorage.getItem('sepbot_line_user_id');
            if (storedUid) {
                document.getElementById('lineUserId').value = storedUid;
            }

            if (typeof liff !== 'undefined') {
                liff.init({ liffId: "2011343821-LOYC4DjR" }).then(() => {
                    if (liff.isLoggedIn()) {
                        liff.getProfile().then(profile => {
                            document.getElementById('lineUserId').value = profile.userId;
                            localStorage.setItem('sepbot_line_user_id', profile.userId);
                        });
                    }
                }).catch(err => {
                    console.log("LIFF Init Fallback:", err);
                });
            }
        };

        document.getElementById('vitalsForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const submitBtn = e.target.querySelector('button[type="submit"]');
            if (submitBtn.disabled) return;
            const msgDiv = document.getElementById('vitalsMsg');
            const msgText = document.getElementById('vitalsMsgText');
            const errorDiv = document.getElementById('vitalsError');
            const errorText = document.getElementById('vitalsErrorText');

            // Hide previous messages
            msgDiv.classList.add('d-none');
            errorDiv.classList.remove('show');

            // Require all fields displayed in this form
            const temp = document.getElementById('temperature').value;
            const sbp = document.getElementById('systolic_bp').value;
            const dbp = document.getElementById('diastolic_bp').value;
            const hr = document.getElementById('heart_rate').value;
            const rr = document.getElementById('respiratory_rate').value;
            const consciousness = document.getElementById('consciousness').value;
            const urine_output = document.getElementById('urine_output').value;

            if (!e.target.reportValidity()) return;
            if (!temp || !sbp || !dbp || !hr || !rr || !consciousness || !urine_output) {
                Swal.fire({
                    title: 'ระบุข้อมูลไม่ครบถ้วน',
                    text: 'กรุณากรอกข้อมูลสัญญาณชีพให้ครบทุกช่องก่อนบันทึกนะคะ',
                    icon: 'warning',
                    confirmButtonText: 'เข้าใจแล้ว',
                    confirmButtonColor: '#0b69a3'
                });
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="bi bi-hourglass-split me-2"></i> กำลังบันทึก...';

            const payload = {
                line_user_id: document.getElementById('lineUserId').value,
                temperature: temp ? parseFloat(temp) : null,
                systolic_bp: sbp ? parseInt(sbp) : null,
                diastolic_bp: dbp ? parseInt(dbp) : null,
                heart_rate: hr ? parseInt(hr) : null,
                respiratory_rate: rr ? parseInt(rr) : null,
                consciousness: consciousness || null,
                urine_output: urine_output || null,
            };

            try {
                const response = await fetch('/api/v1/health/vitals/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (response.ok) {
                    const score = (data.mews_score !== undefined && data.mews_score !== null) ? data.mews_score : 0;
                    const interpretation = data.mews_interpretation || (
                        score <= 1 ? 'ผู้ป่วยอาการปกติ' :
                        score <= 3 ? 'ผู้ป่วยเริ่มมีความผิดปกติ เฝ้าระวังอย่างใกล้ชิด' :
                        'ผู้ป่วยเข้าสู่ภาวะวิกฤต ให้ผู้ป่วยรีบมาโรงพยาบาล'
                    );

                    let badgeColor = '#10b981';
                    let badgeBg = '#ecfdf5';
                    let alertIcon = 'success';
                    if (score >= 4 || data.mews_level === 'red') {
                        badgeColor = '#ef4444';
                        badgeBg = '#fef2f2';
                        alertIcon = 'warning';
                    } else if (score >= 2 || data.mews_level === 'yellow') {
                        badgeColor = '#f59e0b';
                        badgeBg = '#fffbeb';
                        alertIcon = 'info';
                    }

                    Swal.fire({
                        title: `<span style="color: ${badgeColor}; font-weight: 700; font-size: 22px;">รวมคะแนน: ${score} คะแนน</span>`,
                        html: `
                            <div class="p-3 my-2 rounded-3 text-start" style="background-color: ${badgeBg}; border: 1.5px solid ${badgeColor};">
                                <div class="fw-bold mb-1" style="color: ${badgeColor}; font-size: 14.5px;">
                                    📋 ผลการประเมิน:
                                </div>
                                <div class="fw-bold" style="color: #1f2937; font-size: 15.5px;">
                                    ${interpretation}
                                </div>
                            </div>
                            <div class="p-3 rounded-3 text-start small mt-3" style="background: #f8fafc; border: 1px solid #e2e8f0; color: #475569; font-size: 12.5px;">
                                <div class="fw-bold mb-2 text-dark">📌 เกณฑ์การแปลผล:</div>
                                <div class="d-flex align-items-center mb-1">
                                    <span class="badge bg-success me-2" style="font-size: 10.5px;">คะแนน 0-1</span> ผู้ป่วยอาการปกติ
                                </div>
                                <div class="d-flex align-items-center mb-1">
                                    <span class="badge bg-warning text-dark me-2" style="font-size: 10.5px;">คะแนน 2-3</span> ผู้ป่วยเริ่มมีความผิดปกติ เฝ้าระวังอย่างใกล้ชิด
                                </div>
                                <div class="d-flex align-items-center">
                                    <span class="badge bg-danger me-2" style="font-size: 10.5px;">คะแนน ≥ 4</span> ผู้ป่วยเข้าสู่ภาวะวิกฤต ให้ผู้ป่วยรีบมาโรงพยาบาล
                                </div>
                            </div>
                            <div class="mt-2 text-muted" style="font-size: 12px;">ระบบได้ส่งสรุปข้อมูลไปยังห้องแชท LINE แล้วค่ะ</div>
                        `,
                        icon: alertIcon,
                        confirmButtonText: 'รับทราบและปิด',
                        confirmButtonColor: '#0b69a3',
                        timer: 7000,
                        timerProgressBar: true
                    }).then(() => {
                        closeLiffWindow();
                    });
                    return;
                } else {
                    const errorMsg = data.error || data.message || Object.values(data).flat().join('\n') || 'เกิดข้อผิดพลาดในการบันทึกข้อมูล';
                    if (errorMsg.includes("ไม่พบผู้ใช้ในระบบ")) {
                        Swal.fire({
                            title: 'คุณยังไม่ได้ลงทะเบียน',
                            text: 'โปรดลงทะเบียนเพื่อสร้างกลุ่มครอบครัวก่อนเริ่มบันทึกสัญญาณชีพนะคะ',
                            icon: 'warning',
                            confirmButtonText: '📝 ไปหน้าลงทะเบียน',
                            confirmButtonColor: '#E91E63',
                            showCancelButton: true,
                            cancelButtonText: 'ยกเลิก'
                        }).then((res) => {
                            if (res.isConfirmed) {
                                window.location.href = "https://liff.line.me/2011343821-vFX0ZUTO";
                            }
                        });
                    } else {
                        errorText.innerText = errorMsg;
                        errorDiv.classList.add('show');
                    }
                }
            } catch (err) {
                errorText.innerText = 'เกิดข้อผิดพลาดในการเชื่อมต่อเซิร์ฟเวอร์';
                errorDiv.classList.add('show');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="bi bi-save me-2"></i> บันทึกสัญญาณชีพ';
            }
        });

        function closeLiffWindow() {
            try {
                if (typeof liff !== 'undefined') {
                    if (liff.ready && typeof liff.ready.then === 'function') {
                        liff.ready.then(() => {
                            try { liff.closeWindow(); } catch (e) {}
                        });
                    }
                    if (typeof liff.closeWindow === 'function') {
                        liff.closeWindow();
                    }
                }
            } catch (e) {
                console.warn("LIFF close error:", e);
            }
            try {
                window.close();
            } catch (e) {}
        }
    </script>
