<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบบุคลากรทางการแพทย์ - Sepsis Care Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #F8FAFC;
            --card-bg: #FFFFFF;
            --primary-navy: #1E40AF;
            --primary-hover: #1E3A8A;
            --text-dark: #0F172A;
            --text-muted: #64748B;
            --border-color: #E2E8F0;
        }

        body {
            font-family: 'Sarabun', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 15px;
            margin: 0;
        }

        .login-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.05);
            width: 100%;
            max-width: 440px;
            padding: 36px 30px;
        }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: #EFF6FF;
            color: var(--primary-navy);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            border: 1px solid #BFDBFE;
            margin-bottom: 16px;
        }

        .login-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 6px;
        }

        .login-subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 28px;
        }

        .form-label {
            font-weight: 600;
            font-size: 0.88rem;
            color: #334155;
            margin-bottom: 6px;
        }

        .form-control, .form-select {
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 0.95rem;
            background-color: #FFFFFF;
            color: var(--text-dark);
            transition: all 0.2s ease;
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--primary-navy);
            box-shadow: 0 0 0 3px rgba(30, 64, 175, 0.12);
            outline: none;
        }

        .input-icon-group {
            position: relative;
        }

        .input-icon-group i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .input-icon-group .form-control {
            padding-left: 42px;
        }

        .btn-login {
            background-color: var(--primary-navy);
            color: #FFFFFF;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 1rem;
            font-weight: 600;
            width: 100%;
            margin-top: 10px;
            transition: background-color 0.2s ease;
        }

        .btn-login:hover {
            background-color: var(--primary-hover);
            color: #FFFFFF;
        }

        .security-note {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .alert-custom {
            border-radius: 8px;
            font-size: 0.88rem;
            padding: 10px 14px;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="text-center">
        <div class="brand-badge">
            <i class="bi bi-hospital"></i> Sepsis Care Clinical Portal
        </div>
        <h1 class="login-title">เข้าสู่ระบบแพทย์และพยาบาล</h1>
        <p class="login-subtitle">ระบบติดตามและส่งเสริมการดูแลผู้ป่วยหลังภาวะเซพซิส</p>
    </div>

    {% if error_message %}
    <div class="alert alert-danger alert-custom mb-3">
        <i class="bi bi-exclamation-triangle-fill me-1"></i> {{ error_message }}
    </div>
    {% endif %}

    <form method="POST" action="{% url 'doctor-login' %}">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label">บทบาทตำแหน่ง (Role)</label>
            <select name="role" class="form-select">
                <option value="doctor">แพทย์เจ้าของไข้ / แพทย์ผู้ดูแล (Physician)</option>
                <option value="nurse">พยาบาลผู้เชี่ยวชาญ / ทีมวิจัย (Nurse Specialist)</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">ชื่อผู้ใช้ / เลขใบอนุญาตประกอบวิชาชีพ</label>
            <div class="input-icon-group">
                <i class="bi bi-person-badge"></i>
                <input type="text" name="username" class="form-control" placeholder="กรอก Username หรือ เลขใบอนุญาต" required autofocus>
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label">รหัสผ่าน (Password)</label>
            <div class="input-icon-group">
                <i class="bi bi-lock"></i>
                <input type="password" name="password" class="form-control" placeholder="กรอกรหัสผ่าน" required>
            </div>
        </div>

        <button type="submit" class="btn btn-login">
            <i class="bi bi-box-arrow-in-right me-1"></i> เข้าสู่ระบบ (Sign In)
        </button>
    </form>

    <div class="security-note">
        <i class="bi bi-shield-check me-1 text-primary"></i> 
        ระบบสำหรับการใช้งานภายในของบุคลากรทางการแพทย์ที่ได้รับอนุญาตเท่านั้น<br>
        <span class="text-muted">คณะพยาบาลศาสตร์ จุฬาลงกรณ์มหาวิทยาลัย</span>
    </div>
</div>

</body>
</html>
