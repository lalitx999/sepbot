services:
  redis:
    image: redis:7-alpine
    container_name: sepbot_redis
    restart: always
    expose:
      - "6379"
    networks:
      - default
      - global_net

  web:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sepbot_web
    restart: always
    command: sh -c "python manage.py migrate && python manage.py collectstatic --noinput && python /scripts/seed_faq.py && python /scripts/seed_knowledge.py && python /scripts/seed_images.py && gunicorn sepbot.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - ./backend:/app
      - ./backend/media:/app/media
      - ./scripts:/scripts
    ports:
      - "${PORT:-8020}:8000"
    env_file:
      - .env
    depends_on:
      - redis
    networks:
      - default
      - global_net

  celery_worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sepbot_celery_worker
    restart: always
    command: celery -A sepbot worker --loglevel=info
    volumes:
      - ./backend:/app
      - ./scripts:/scripts
    env_file:
      - .env
    depends_on:
      - redis
    networks:
      - default
      - global_net

  celery_beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sepbot_celery_beat
    restart: always
    command: celery -A sepbot beat --loglevel=info
    volumes:
      - ./backend:/app
      - ./scripts:/scripts
    env_file:
      - .env
    depends_on:
      - redis
    networks:
      - default
      - global_net

volumes:
  static_volume:

networks:
  global_net:
    external: true
